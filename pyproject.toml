[project]
name = "cap-931"
version = "0.1.0"
description = "Source-grounded multi-agent sales research prototype for CAP 931"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "groq>=1.7.0",
    "pydantic>=2.14.1",
    "pypdf>=6.21.2",
    "python-dotenv>=1.2.4",
    "reportlab>=5.1.0",
    "requests>=2.34.2",
    "streamlit>=1.66.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
